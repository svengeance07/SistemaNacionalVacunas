<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=vistas/login.html">
    <title>SIV-GUÁRICO // Sistema Integrado de Vacunación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .portal-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 36px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.1);
            text-align: center;
            max-width: 460px;
        }

        .cross-badge {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.3);
        }

        h1 {
            font-size: 1.4rem;
            margin: 0 0 6px 0;
            color: #0f172a;
        }

        p {
            font-size: 0.88rem;
            color: #64748b;
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .enter-btn {
            display: inline-block;
            background: #0284c7;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background 0.2s ease;
        }

        .enter-btn:hover {
            background: #0369a1;
        }
    </style>
</head>

<body>
    <div class="portal-card">
        <div class="cross-badge">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 4v16m-8-8h16"></path>
            </svg>
        </div>
        <h1>SIV-GUÁRICO</h1>
        <p>Sistema de Inmunizaciones y Salud Pública<br>Redirigiendo al <strong>Acceso Institucional (MVC)</strong>...</p>
        <a href="vistas/login.html" class="enter-btn">Iniciar sesión &rarr;</a>
    </div>
</body>

</html>
